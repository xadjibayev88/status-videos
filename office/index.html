<title>AI-ofis</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  /* Layout: top-down 2D office (canvas) on the left, the orchestrator panel (chat + tasks) on the right, agent status chips along the bottom. One warm "daylight office" look on purpose. */
  :root {
    --bg: #1d1a24;        /* page around the office */
    --panel: #fffaf0;     /* orchestrator panel paper */
    --ink: #24202b;
    --muted: #7b7368;
    --line: #e6dccb;
    --accent: #6b4dff;    /* orchestrator violet */
    --ok: #2fb36b;
    --warn: #f0a020;
    --display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
    --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
    color-scheme: light;
  }
  * { box-sizing: border-box }
  html, body { height: 100%; margin: 0 }
  body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--body); display: flex; flex-direction: column; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); padding-block: 10px }
  header { display: flex; align-items: center; gap: 10px; color: #f4efe6; padding: 0 2px 8px; flex-wrap: wrap }
  header .logo { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); display: grid; place-items: center; font: 700 13px var(--display); color: #fff }
  header h1 { margin: 0; font: 700 17px var(--display) }
  header .model { font: 12px var(--mono); color: #b9aee0; background: #2c2738; border-radius: 999px; padding: 3px 10px }
  header a { margin-left: auto; color: #f4efe6; font-size: 13px; border: 1px solid #4a4358; border-radius: 8px; padding: 5px 10px; text-decoration: none }
  header a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 12px }
  .room { position: relative; min-width: 0; min-height: 0; background: #2a2531; border-radius: 16px; overflow: hidden; border: 3px solid #3a3346 }
  canvas { display: block; width: 100%; height: 100%; touch-action: manipulation; cursor: pointer }
  .tip { position: absolute; left: 12px; top: 10px; background: rgba(255,250,240,.92); border-radius: 999px; padding: 4px 12px; font-size: 12px; color: var(--muted) }
  aside { background: var(--panel); border-radius: 16px; display: flex; flex-direction: column; min-height: 0; overflow: hidden }
  .orch { display: flex; gap: 10px; align-items: center; padding: 14px 14px 10px; border-bottom: 1px solid var(--line) }
  .orch .av { width: 40px; height: 40px; border-radius: 12px; background: var(--accent); color: #fff; display: grid; place-items: center; font: 700 18px var(--display); flex: none }
  .orch b { display: block; font: 700 15px var(--display) }
  .orch small { color: var(--muted); font-size: 12px }
  .tabs { display: flex; gap: 4px; padding: 8px 12px 0 }
  .tabs button { flex: 1; border: 0; background: #f1e8d8; color: var(--muted); border-radius: 9px 9px 0 0; padding: 7px 0; font: 600 13px var(--body); cursor: pointer }
  .tabs button[aria-selected="true"] { background: #fff; color: var(--ink); box-shadow: 0 -1px 0 var(--line) inset }
  .view { flex: 1; min-height: 0; overflow: auto; padding: 10px 12px 12px; background: #fff }
  .msg { display: flex; gap: 8px; margin-bottom: 10px }
  .msg .dot { width: 26px; height: 26px; border-radius: 8px; flex: none; display: grid; place-items: center; color: #fff; font: 700 11px var(--display) }
  .msg .b { background: #f6f1ff; border-radius: 4px 12px 12px 12px; padding: 7px 10px; min-width: 0 }
  .msg .b b { font-size: 12px }
  .msg .b p { margin: 2px 0 0; font-size: 13px }
  .msg .b time { font: 11px var(--mono); color: var(--muted) }
  .note { font-size: 12px; color: var(--muted); background: #fbf6ec; border: 1px dashed var(--line); border-radius: 10px; padding: 8px 10px; margin-bottom: 10px }
  .task { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 8px; align-items: start; padding: 8px 0; border-bottom: 1px solid #f1eadf }
  .task time { font: 12px var(--mono); color: var(--muted); padding-top: 1px; font-variant-numeric: tabular-nums }
  .task .t { font-size: 13px } .task .a { font-size: 11px; color: var(--muted); font-family: var(--mono) }
  .pill { font-size: 11px; border-radius: 999px; padding: 2px 8px; white-space: nowrap }
  .pill.done { background: #e3f6ea; color: #1d7a47 } .pill.wait { background: #f3eee5; color: var(--muted) } .pill.bad { background: #fff0d9; color: #95600a }
  h3 { margin: 12px 0 4px; font: 600 11px var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted) }
  #card { border-top: 1px solid var(--line); padding: 10px 14px; font-size: 13px; background: var(--panel) }
  #card b { font: 700 14px var(--display) } #card small { color: var(--muted) }
  footer { display: flex; gap: 8px; overflow-x: auto; padding-top: 10px; scrollbar-width: thin }
  .chip { flex: none; display: flex; align-items: center; gap: 7px; background: #fffaf0; border-radius: 10px; padding: 6px 10px; font-size: 12px; border: 0; cursor: pointer; color: var(--ink); font-family: var(--body) }
  .chip i { width: 18px; height: 18px; border-radius: 6px; display: block; flex: none }
  .chip span { display: block; line-height: 1.15; text-align: left } .chip small { color: var(--muted); font-size: 11px }
  .chip.on small { color: var(--ok) }
  @media (max-width: 860px) {
    body { height: auto; min-height: 100% } html { height: auto }
    main { grid-template-columns: 1fr; flex: none } .room { height: 62vw; min-height: 300px } aside { height: 520px }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>

<header>
  <div class="logo">AI</div><h1>AI-ofis</h1><span class="model">44 agent · xadjibayev88</span>
  <a href="3d.html">3D ko'rinish</a>
</header>
<main>
  <section class="room" aria-label="AI-ofis xonasi">
    <canvas id="c"></canvas>
    <div class="tip">Agentni bosing: u kim va nima qiladi</div>
  </section>
  <aside>
    <div class="orch"><div class="av">A</div><div><b>AI-orkestrator</b><small>chief-of-staff · vazifani jamoalarga bo'lib beradi</small></div></div>
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-v="chat">Chat</button>
      <button role="tab" aria-selected="false" data-v="tasks">Vazifalar</button>
    </div>
    <div class="view" id="chat"></div>
    <div class="view" id="tasks" hidden></div>
    <div id="card" hidden></div>
  </aside>
</main>
<footer id="chips" aria-label="Agentlar holati"></footer>

<script>
(async function () {
  const get = f => fetch(f).then(r => r.ok ? r.json() : null).catch(() => null);
  const [data, activity, tasks] = await Promise.all([get('agents.json'), get('activity.json'), get('tasks.json')]);
  const depts = data?.departments || [];
  const COL = { 'The Brain (lobby)': '#6b4dff', 'Research': '#3d7bff', 'Inbox': '#a560f0', 'Scripts': '#f08a24', 'Dev': '#25a861', 'TBX Shop': '#e8505b', 'Social': '#e04fb0', 'Creative': '#18a9b8', 'Analytics': '#78b82a' };
  const UZ = { 'The Brain (lobby)': 'Bosh ofis', 'Research': 'Tadqiqot', 'Inbox': 'Pochta', 'Scripts': 'Ssenariy', 'Dev': 'Dasturlash', 'TBX Shop': "Do'kon", 'Social': 'Ijtimoiy tarmoq', 'Creative': 'Montaj', 'Analytics': 'Analitika' };
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const short = n => n.replace(/^marketing-/, '').replace(/-/g, ' ');

  // ---------- room layout (logical 1200 x 780) ----------
  const LW = 1200, LH = 780, WALL = 92, PAD = 26, cols = 3;
  const rows = Math.ceil(depts.length / cols);
  const pw = (LW - PAD * (cols + 1)) / cols, ph = (LH - WALL - 40 - PAD * (rows + 1)) / rows;
  const agents = [], byName = new Map(), pods = [];
  depts.forEach((d, i) => {
    const x = PAD + (i % cols) * (pw + PAD), y = WALL + 20 + PAD + Math.floor(i / cols) * (ph + PAD);
    const color = COL[d.name] || '#888';
    pods.push({ d, x, y, w: pw, h: ph, color });
    const n = d.agents.length, per = n > 6 ? 5 : Math.min(n, 3) || 1, rowsN = Math.ceil(n / per);
    d.agents.forEach((a, j) => {
      const r = Math.floor(j / per), k = j % per, inRow = Math.min(per, n - r * per);
      const dx = x + pw / 2 + (k - (inRow - 1) / 2) * (pw / (per + .3));
      const dy = y + 46 + (r + .5) * ((ph - 56) / rowsN);
      const rec = { ...a, team: d.name, color, desk: { x: dx, y: dy + 14 }, home: { x: dx, y: dy - 12 }, pos: { x: dx, y: dy - 12 }, mode: 'sit', path: [], wait: 0, working: false, ph: Math.random() * 6 };
      agents.push(rec); byName.set(a.name, rec);
    });
  });
  const chief = byName.get('chief-of-staff');

  // ---------- canvas ----------
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  let scale = 1, ox = 0, oy = 0;
  function resize() {
    const r = cv.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2);
    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
    scale = Math.min(cv.width / LW, cv.height / LH); ox = (cv.width - LW * scale) / 2; oy = (cv.height - LH * scale) / 2;
  }
  addEventListener('resize', resize); resize();
  const rr = (x, y, w, h, r) => { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); };

  function drawRoom(t) {
    // floor checks
    for (let y = WALL; y < LH; y += 40) for (let x = 0; x < LW; x += 40) { ctx.fillStyle = ((x + y) / 40) % 2 ? '#f6e7c8' : '#f1deb9'; ctx.fillRect(x, y, 40, 40); }
    // wall with windows and sign
    ctx.fillStyle = '#2d2737'; ctx.fillRect(0, 0, LW, WALL);
    for (let i = 0; i < 4; i++) { const wx = 40 + i * 190; ctx.fillStyle = '#c9dff2'; ctx.fillRect(wx, 18, 150, 50); ctx.fillStyle = '#9ec2e2'; ctx.fillRect(wx + 74, 18, 3, 50); ctx.strokeStyle = '#f4efe6'; ctx.lineWidth = 4; ctx.strokeRect(wx, 18, 150, 50); }
    ctx.fillStyle = '#6b4dff'; rr(850, 20, 230, 50, 8); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '700 30px "Chakra Petch", sans-serif'; ctx.textAlign = 'center'; ctx.fillText('AI-OFIS', 965, 56);
    ctx.fillStyle = '#1b1722'; ctx.fillRect(0, WALL - 6, LW, 6);
    // clock
    const now = new Date(Date.now() + (5 * 60 + new Date().getTimezoneOffset()) * 60000);
    ctx.fillStyle = '#f4efe6'; ctx.font = '600 18px "IBM Plex Mono", monospace'; ctx.fillText(now.toTimeString().slice(0, 5) + ' TSH', 1140, 52);
    // pods
    pods.forEach(p => {
      ctx.fillStyle = p.color + '1f'; rr(p.x, p.y, p.w, p.h, 14); ctx.fill();
      ctx.strokeStyle = p.color + '88'; ctx.lineWidth = 2; ctx.setLineDash([8, 6]); rr(p.x, p.y, p.w, p.h, 14); ctx.stroke(); ctx.setLineDash([]);
      const busy = p.d.agents.filter(a => byName.get(a.name).working).length;
      ctx.font = '700 16px "Chakra Petch", sans-serif'; ctx.textAlign = 'left';
      const label = `${UZ[p.d.name] || p.d.name}`, lw = ctx.measureText(label).width;
      ctx.fillStyle = p.color; rr(p.x + 10, p.y + 8, lw + 18, 24, 7); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.fillText(label, p.x + 19, p.y + 26);
      ctx.fillStyle = '#7b7368'; ctx.font = '500 12px "IBM Plex Sans", sans-serif'; ctx.fillText(`${busy}/${p.d.agents.length} ishlayapti`, p.x + lw + 36, p.y + 25);
    });
    // decor: plants and sofa
    [[14, WALL + 10], [LW - 40, WALL + 10], [14, LH - 46], [LW - 40, LH - 46]].forEach(([x, y]) => { ctx.fillStyle = '#b5652b'; rr(x + 4, y + 16, 18, 16, 3); ctx.fill(); ctx.fillStyle = '#4f9d3a'; ctx.beginPath(); ctx.arc(x + 13, y + 12, 13, 0, 7); ctx.fill(); });
    ctx.fillStyle = '#ef6a2b'; rr(LW / 2 - 70, LH - 34, 140, 26, 8); ctx.fill(); ctx.fillStyle = '#d4521a'; rr(LW / 2 - 70, LH - 34, 140, 8, 4); ctx.fill();
  }
  function drawDesk(a, t) {
    const { x, y } = a.desk;
    ctx.fillStyle = '#c08a4e'; rr(x - 34, y - 6, 68, 26, 4); ctx.fill(); ctx.fillStyle = '#9c6b37'; ctx.fillRect(x - 34, y + 16, 68, 4);
    const glow = a.working ? (Math.sin(t / 120 + a.ph) > 0 ? a.color : '#fff') : '#1c1a22';
    ctx.fillStyle = '#111'; rr(x - 16, y - 22, 32, 20, 3); ctx.fill(); ctx.fillStyle = glow; ctx.fillRect(x - 13, y - 19, 26, 14);
    ctx.fillStyle = '#111'; ctx.fillRect(x - 3, y - 3, 6, 4);
  }
  function drawBot(a, t) {
    const { x, y } = a.pos, walking = a.mode === 'walk', bob = walking ? Math.abs(Math.sin(t / 90 + a.ph)) * 3 : a.working ? Math.abs(Math.sin(t / 160 + a.ph)) * 2 : 0;
    const by = y - bob;
    ctx.fillStyle = 'rgba(0,0,0,.12)'; ctx.beginPath(); ctx.ellipse(x, y + 16, 13, 4, 0, 0, 7); ctx.fill();
    if (a.working) { ctx.strokeStyle = '#2fb36b'; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(x, y + 16, 17, 6, 0, 0, 7); ctx.stroke(); }
    ctx.fillStyle = a.color; rr(x - 11, by - 2, 22, 18, 6); ctx.fill();                   // body
    ctx.fillStyle = '#f7f3ff'; rr(x - 12, by - 22, 24, 20, 7); ctx.fill();               // head
    ctx.strokeStyle = a.color; ctx.lineWidth = 2; rr(x - 12, by - 22, 24, 20, 7); ctx.stroke();
    ctx.fillStyle = '#24202b'; ctx.fillRect(x - 7, by - 15, 4, 5); ctx.fillRect(x + 3, by - 15, 4, 5);   // eyes
    ctx.strokeStyle = a.color; ctx.beginPath(); ctx.moveTo(x, by - 22); ctx.lineTo(x, by - 29); ctx.stroke();
    ctx.fillStyle = a.role === 'head' ? '#ffcf3a' : a.color; ctx.beginPath(); ctx.arc(x, by - 31, 3.5, 0, 7); ctx.fill();
    if (a.working && !walking) { ctx.fillStyle = '#fff'; rr(x + 10, by - 40, 26, 15, 6); ctx.fill(); ctx.fillStyle = '#6b4dff'; for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(x + 17 + i * 6, by - 32.5, 1.8 + (Math.floor(t / 250) % 3 === i ? .8 : 0), 0, 7); ctx.fill(); } }
    ctx.font = '600 10px "IBM Plex Sans", sans-serif'; ctx.textAlign = 'center';
    const nm = short(a.name), w = ctx.measureText(nm).width + 10;
    ctx.fillStyle = 'rgba(255,255,255,.9)'; rr(x - w / 2, y + 22, w, 15, 5); ctx.fill(); ctx.fillStyle = '#24202b'; ctx.fillText(nm, x, y + 33);
  }

  // ---------- life: walk to the orchestrator or a colleague ----------
  function sendWalk(a, to, stay = 2) { if (!a || a.mode !== 'sit') return; a.path = [{ x: to.x + (Math.random() - .5) * 30, y: to.y + 26 }, { ...a.home }]; a.mode = 'walk'; a.stay = stay; }
  function randomTrip() {
    const idle = agents.filter(a => a.mode === 'sit' && a !== chief); if (!idle.length || agents.filter(a => a.mode !== 'sit').length > 6) return;
    const a = idle[Math.floor(Math.random() * idle.length)], to = Math.random() < .4 && chief ? chief.home : agents[Math.floor(Math.random() * agents.length)].home;
    sendWalk(a, to);
  }
  function step(dt) {
    agents.forEach(a => {
      if (a.mode === 'walk') {
        const tg = a.path[0], dx = tg.x - a.pos.x, dy = tg.y - a.pos.y, d = Math.hypot(dx, dy);
        if (d < 2) { a.path.shift(); if (a.path.length) { a.mode = 'talk'; a.wait = a.stay; } else a.mode = 'sit'; }
        else { const s = Math.min(d, dt * 120); a.pos.x += dx / d * s; a.pos.y += dy / d * s; }
      } else if (a.mode === 'talk') { a.wait -= dt; if (a.wait <= 0) a.mode = 'walk'; }
    });
  }
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) setInterval(() => !document.hidden && randomTrip(), 1300);

  let last = 0;
  (function frame(t) {
    const dt = Math.min(.05, (t - last) / 1000 || 0); last = t; if (!reduce) step(dt);
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#2a2531'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.setTransform(scale, 0, 0, scale, ox, oy);
    drawRoom(t); agents.forEach(a => drawDesk(a, t));
    agents.slice().sort((p, q) => p.pos.y - q.pos.y).forEach(a => drawBot(a, t));
    requestAnimationFrame(frame);
  })(0);

  // ---------- click: who is this ----------
  const card = document.getElementById('card');
  function showCard(a) {
    card.hidden = false;
    card.innerHTML = `<b>${esc(a.name)}</b><br><small>${esc(UZ[a.team] || a.team)} · ${a.role === 'head' ? "jamoa boshlig'i" : 'xodim'} · ${a.working ? 'ishlayapti' : "bo'sh"}</small><p style="margin:6px 0 0">${esc(a.description)}</p>`;
  }
  cv.addEventListener('click', e => {
    const r = cv.getBoundingClientRect(), dpr = cv.width / r.width;
    const x = ((e.clientX - r.left) * dpr - ox) / scale, y = ((e.clientY - r.top) * dpr - oy) / scale;
    let best = null, bd = 30; agents.forEach(a => { const d = Math.hypot(a.pos.x - x, a.pos.y - 8 - y); if (d < bd) { bd = d; best = a; } });
    if (best) showCard(best);
  });

  // ---------- panel: chat (real work log) and tasks ----------
  const chat = document.getElementById('chat'), tasksEl = document.getElementById('tasks');
  chat.innerHTML = `<div class="note">Buyruq berish: Claude ilovasida shu suhbatga yozing (ovozli xabar ham bo'ladi). Orkestrator vazifani jamoalarga bo'lib beradi, natija shu yerda va kanallarda chiqadi.</div>` +
    (activity || []).map(e => { const a = byName.get(e.agent); const c = a?.color || '#888';
      return `<div class="msg"><div class="dot" style="background:${c}">${esc((e.agent || '?')[0].toUpperCase())}</div><div class="b"><b>${esc(e.agent)}</b> <time>${esc(e.when)}</time><p>${esc(e.text)}</p></div></div>`; }).join('');
  const nowMin = (() => { const d = new Date(Date.now() + (5 * 60 + new Date().getTimezoneOffset()) * 60000); return d.getHours() * 60 + d.getMinutes(); })();
  const toMin = s => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };
  tasksEl.innerHTML = `<h3>Bugungi jadval</h3>` + (tasks?.schedule || []).map(t => {
      const done = toMin(t.time) <= nowMin;
      return `<div class="task"><time>${esc(t.time)}</time><div><div class="t">${esc(t.text)}</div><div class="a">${esc(t.agent)}</div></div><span class="pill ${done ? 'done' : 'wait'}">${done ? 'vaqti o\'tdi' : 'kutilmoqda'}</span></div>`; }).join('') +
    `<h3>Navbat va tekshiruv</h3>` + (tasks?.queue || []).map(q => `<div class="task"><time>—</time><div><div class="t">${esc(q.text)}</div><div class="a">${esc(q.agent)}</div></div><span class="pill ${q.ok ? 'done' : 'bad'}">${q.ok ? 'joyida' : "to'ldirish kerak"}</span></div>`).join('');
  document.querySelector('.tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return;
    document.querySelectorAll('.tabs button').forEach(x => x.setAttribute('aria-selected', x === b)); chat.hidden = b.dataset.v !== 'chat'; tasksEl.hidden = b.dataset.v !== 'tasks'; });

  // ---------- bottom chips ----------
  const chips = document.getElementById('chips');
  chips.innerHTML = agents.map(a => `<button class="chip" type="button" data-n="${esc(a.name)}"><i style="background:${a.color}"></i><span>${esc(short(a.name))}<br><small>${esc(UZ[a.team] || a.team)} · bo'sh</small></span></button>`).join('');
  chips.addEventListener('click', e => { const b = e.target.closest('.chip'); if (b) showCard(byName.get(b.dataset.n)); });
  function setWorking(a, on) { a.working = on; const c = chips.querySelector(`[data-n="${CSS.escape(a.name)}"]`); if (c) { c.classList.toggle('on', on); c.querySelector('small').textContent = `${UZ[a.team] || a.team} · ${on ? 'ishlayapti' : "bo'sh"}`; } }

  // replay today's real work: the agent lights up and walks to the orchestrator
  let i = 0;
  function replay() {
    const list = activity || []; if (!list.length) return;
    const e = list[i++ % list.length], a = byName.get(e.agent); if (!a) return;
    setWorking(a, true); if (chief) { setWorking(chief, true); setTimeout(() => setWorking(chief, false), 3000); }
    if (a !== chief) sendWalk(a, chief ? chief.home : a.home, 2);
    setTimeout(() => setWorking(a, false), 6500);
  }
  setInterval(replay, 4000); setTimeout(replay, 800);
})();
</script>
