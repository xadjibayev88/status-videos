# OpenMontage settings for this office: free sources only, no money spent.
# install.sh copies this over OpenMontage's config.yaml after cloning.
llm:
  provider: anthropic            # the assistant you run it in does the thinking
  model: null
  temperature: 0.7
  max_tokens: 4096

budget:
  mode: cap                      # hard stop instead of a warning
  total_usd: 0.00                # office rule: never spend money
  reserve_pct: 0.0
  single_action_approval_usd: 0.00
  require_approval_for_new_paid_tool: true

checkpoint:
  policy: guided
  storage_dir: pipeline

output:
  default_format: mp4
  default_codec: libx264
  default_audio_codec: aac
  default_resolution: "1080x1920"  # vertical, for Shorts and Reels
  default_fps: 30
  default_crf: 23

paths:
  pipeline_dir: pipeline
  library_dir: library
  styles_dir: styles
  skills_dir: skills
  output_dir: output
